name: Update share data

on:
  schedule:
    # 22:30 UTC Mon-Fri = after the US close, about 9am Adelaide time
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/update_data.py
      - name: Commit data.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
          git push
